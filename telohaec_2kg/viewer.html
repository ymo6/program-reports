.","pmid":"29581412","year":"2018","url":"https://pubmed.ncbi.nlm.nih.gov/29581412/","same":false}],"literature":[]}},{"gene":"HNRNPA3","verdict":"mixed","why":"HNRNPA3 is a general hnRNP splicing factor and is upregulated in proliferative cancer, but no direct link to proliferative splicing program shown.","cell_type":"evidence from other cell types","supporting":[{"title":"Abnormal expression of HNRNPA3 in multistep hepatocarcinogenesis","text":"HNRNPA3 is an RNA-binding/splicing hnRNP whose expression rises stepwise with hepatocarcinoma progression, linking it to proliferation.","pmid":"33281957","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/33281957/","same":false},{"title":"PEDV inhibits HNRNPA3 expression by miR-218-5p to enhance cellular lipid accumulation and promote viral replication","text":"Shows HNRNPA3 regulates lipid metabolism and viral replication in Marc-145 cells, unrelated to splicing/proliferation program.","pmid":"38259103","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/38259103/","same":false}],"other":{"gene_function":[{"title":"SARS-CoV-2 N protein-induced Dicer, XPO5, SRSF3, and hnRNPA3 downregulation causes pneumonia.","text":"SARS-CoV-2 N protein binds hnRNPA3 and induces its autophagic degradation, and hnRNPA3 loss (via knockdown) worsens N protein-induced pneumonia while overexpression protects, implicating hnRNPA3 in RNA splicing-dependent suppression of DNA damage and proteotoxic stress.","pmid":"39138195","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/39138195/","same":false}],"literature":[]}},{"gene":"GGH","verdict":"mixed","why":"GGH stabilizes cell-cycle mRNAs supporting proliferation but no evidence links it to hnRNP-driven splicing/processing.","cell_type":"evidence from other cell types","supporting":[{"title":"The GGH/HuR Complex Binds and Stabilizes mRNAs to Maintain Tumor Cell Cycle and DNA Replication","text":"GGH stabilizes CCND1/CDC6 mRNAs via HuR to drive proliferation, not splicing, in lung cancer cells.","pmid":"40831251","year":"2025","url":"https://pubmed.ncbi.nlm.nih.gov/40831251/","same":false},{"title":"High-Level \u03b3-Glutamyl-Hydrolase (GGH) Expression is Linked to Poor Prognosis in ERG Negative Prostate Cancer","text":"GGH overexpression linked to tumor aggressiveness but not to splicing/processing or endothelial biology.","pmid":"28146062","year":"2017","url":"https://pubmed.ncbi.nlm.nih.gov/28146062/","same":false}],"other":{"gene_function":[{"title":"Deciphering the molecular landscape of NMDAR-E associated ovarian teratomas: a Multi-Omics approach.","text":"GGH is among genes/proteins differentially expressed in NMDAR-E associated ovarian teratomas, implicated in ferroptosis and immune activation pathways.","pmid":"41339905","year":"2025","url":"https://pubmed.ncbi.nlm.nih.gov/41339905/","same":false}],"literature":[]}}],"others":[{"gene":"HMGB1","verdict":"insufficient","why":"Evidence covers HMGB1 in mitochondrial transfer and apoptosis signaling, not mRNA splicing/processing or proliferation support.","other":{"gene_function":[{"title":"Editorial: The Role of HMGB1 in Immunity.","text":"This editorial reviews HMGB1's roles as a DAMP molecule modulating immune responses, inflammation, tissue repair and disease progression across multiple conditions.","pmid":"33013940","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/33013940/","same":false},{"title":"HMGB1 promotes mitochondrial transfer between hepatocellular carcinoma cells through RHOT1 and RAC1 under hypoxia.","text":"HMGB1 promotes mitochondrial transfer between hepatocellular carcinoma cells via upregulation of RHOT1 and RAC1 under hypoxia, enhancing cancer cell migration and invasion.","pmid":"38378644","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/38378644/","same":false},{"title":"HMGB1 mediates hyperglycaemia-induced cardiomyocyte apoptosis via ERK/Ets-1 signalling pathway.","text":"HMGB1 knockdown reduces hyperglycaemia-induced cardiomyocyte apoptosis by attenuating ERK-dependent activation of Ets-1.","pmid":"25210949","year":"2014","url":"https://pubmed.ncbi.nlm.nih.gov/25210949/","same":false}],"literature":[]}},{"gene":"HMGN2","verdict":"insufficient","why":"Evidence links HMGN2 to chromatin organization, R-loop regulation and proliferation but not to mRNA splicing/processing.","other":{"gene_function":[{"title":"The miR-144/Hmgn2 regulatory axis orchestrates chromatin organization during erythropoiesis.","text":"Hmgn2 is a conserved miR-144 target whose dysregulation impairs chromatin condensation during erythrocyte maturation, acting as a key chromatin regulator in erythropoiesis.","pmid":"38714702","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/38714702/","same":false},{"title":"HMGN2 deficiency drives DLBCL progression through impaired R-loop formation and PI3K-AKT hyperactivation.","text":"HMGN2 deficiency promotes DLBCL progression by impairing R-loop formation, derepressing IL4R and hyperactivating PI3K-AKT signaling, while HMGN2 knockdown enhances proliferation/clonogenicity and overexpression is inhibitory.","pmid":"42050655","year":"2026","url":"https://pubmed.ncbi.nlm.nih.gov/42050655/","same":false},{"title":"HMGN2 regulates non-tuberculous mycobacteria survival via modulation of M1 macrophage polarization.","text":"HMGN2 is induced during NTM-triggered M1 macrophage polarization and its knockdown enhances M1 polarization (NO, iNOS, cytokines) via NF-\u03baB and MAPK signaling, affecting NTM survival in macrophages.","pmid":"31596045","year":"2019","url":"https://pubmed.ncbi.nlm.nih.gov/31596045/","same":false}],"literature":[]}},{"gene":"PTMA","verdict":"insufficient","why":"Evidence only shows PTMA promotes cardiomyocyte proliferation via STAT3 acetylation, not splicing/processing in endothelial cells.","other":{"gene_function":[{"title":"PTMA controls cardiomyocyte proliferation and cardiac repair by enhancing STAT3 acetylation.","text":"PTMA drives cardiomyocyte proliferation and promotes neonatal and adult heart regeneration by enhancing STAT3 acetylation.","pmid":"40408476","year":"2025","url":"https://pubmed.ncbi.nlm.nih.gov/40408476/","same":false},{"title":"The simultaneous administration of microplastics and cadmium alters rat testicular activity and changes the expression of PTMA, DAAM1 and PREP.","text":"Microplastic and cadmium exposure alter PTMA protein levels in rat testis, implicating PTMA in germ cell proliferation/differentiation disruption and apoptosis during toxicant-induced testicular damage.","pmid":"36968197","year":"2023","url":"https://pubmed.ncbi.nlm.nih.gov/36968197/","same":false},{"title":"PTMA, a new identified autoantigen for oral submucous fibrosis, regulates oral submucous fibroblast proliferation and extracellular matrix.","text":"PTMA is an autoantigen overexpressed in oral submucous fibrosis and regulates TGF\u03b21-induced fibroblast proliferation and extracellular matrix deposition.","pmid":"29088825","year":"2017","url":"https://pubmed.ncbi.nlm.nih.gov/29088825/","same":false}],"literature":[]}},{"gene":"HNRNPA2B1","verdict":"insufficient","why":"No evidence ties HNRNPA2B1 to mRNA splicing/processing or proliferation in endothelial cells; papers cover cancer RNA stability and prion-like aggregation.","other":{"gene_function":[{"title":"Tyrosine phosphorylation regulates hnRNPA2 granule protein partitioning and reduces neurodegeneration.","text":"Tyrosine phosphorylation of hnRNPA2 by Fyn reduces its liquid-liquid phase separation and granule partitioning with hnRNPF and ch-TOG, decreasing aggregation of disease variants and rescuing neurodegeneration in a C. elegans model.","pmid":"33349959","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/33349959/","same":false},{"title":"N6-methyladenosine reader hnRNPA2B1 recognizes and stabilizes NEAT1 to confer chemoresistance in gastric cancer.","text":"hnRNPA2B1 is an m6A reader that binds and stabilizes lncRNA NEAT1, promoting Wnt/\u03b2-catenin-driven cancer stemness and chemoresistance ","pmid":"33463054","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/33463054/","same":false}],"literature":[]}},{"gene":"H2AFV","verdict":"insufficient","why":"No evidence that H2AFV regulates mRNA splicing/processing or hnRNP-driven proliferative programs.","other":{"gene_function":[{"title":"Developmentally regulated H2Av buffering via dynamic sequestration to lipid droplets in Drosophila embryos.","text":"H2Av histone dynamically exchanges with lipid droplets, which buffer its nuclear accumulation in a developmentally regulated manner.","pmid":"30044219","year":"2018","url":"https://pubmed.ncbi.nlm.nih.gov/30044219/","same":false},{"title":"Drosophila H2Av negatively regulates the activity of the IMD pathway via facilitating Relish SUMOylation.","text":"Loss-of-function H2Av mutants show upregulated IMD-dependent antimicrobial peptide expression due to impaired Relish SUMOylation.","pmid":"34370736","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/34370736/","same":false},{"title":"Long noncoding RNA lnc-H2AFV-1 promotes cell growth by regulating aberrant m6A RNA modification in head and neck squamous cell carcinoma.","text":"A long noncoding RNA transcribed from the H2AFV locus (lnc-H2AFV-1) promotes HNSCC cell proliferation by regulating m6A RNA methylation via METTL3/14 and FTO, affecting IFT80 expression.","pmid":"35403343","year":"2022","url":"https://pubmed.ncbi.nlm.nih.gov/35403343/","same":false}],"literature":[]}},{"gene":"LMNA","verdict":"insufficient","why":"Evidence covers LMNA's roles in nuclear mechanics, DNA damage, and cardiomyopathy, not hnRNP-driven splicing or proliferation.","other":{"gene_function":[{"title":"Consequences of Lmna Exon 4 Mutations in Myoblast Function.","text":"Lmna exon 4 mutations cause abnormal nuclear morphology, altered localization of lamin/LINC complex members, DNA damage accumulation (R249W), and impaired myogenic differentiation.","pmid":"32455813","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/32455813/","same":false},{"title":"Current insights into LMNA cardiomyopathies: Existing models and missing LINCs.","text":"LMNA mutations disrupt nuclear lamina structure and function leading to mechanical instability and gene expression dysregulation causing cardiomyopathy.","pmid":"28125396","year":"2017","url":"https://pubmed.ncbi.nlm.nih.gov/28125396/","same":false},{"title":"LMNA-related cardiomyopathy: From molecular pathology to cardiac gene therapy.","text":"LMNA variants cause cardiomyopathy through diverse mechanisms including mechanical disruption of the nucleus, DNA damage, altered nuclear organization/transcription, and MAPK-mTOR signaling dysregulation, with effects also noted in non-cardiomyocyte cells including endothelial cells.","pmid":"39827909","year":"2025","url":"https://pubmed.ncbi.nlm.nih.gov/39827909/","same":false}],"literature":[]}},{"gene":"ENO1","verdict":"insufficient","why":"ENO1 evidence shows glycolytic metabolism and cancer proliferation roles, not mRNA splicing/processing or hnRNP-driven activity.","other":{"gene_function":[{"title":"USP21 deubiquitinates and stabilizes HSP90 and ENO1 to promote aerobic glycolysis and proliferation in cholangiocarcinoma.","text":"USP21 directly deubiquitinates and stabilizes ENO1 protein, promoting aerobic glycolysis and proliferation in cholangiocarcinoma cells.","pmid":"38385089","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/38385089/","same":false},{"title":"Metabolic Recoding of NSUN2-Mediated m5C Modification Promotes the Progression of Colorectal Cancer via the NSUN2/YBX1/m5C-ENO1 Positive Feedback Loop.","text":"ENO1 mRNA is a target of NSUN2-mediated m5C methylation read by YBX1, leading to increased ENO1 expression, glycolytic reprogramming and lactic acid production that drives colorectal cancer progression.","pmid":"38769664","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/38769664/","same":false},{"title":"ENO1 from Mycoplasma bovis Disrupts Host Glycolysis and Inflammation by Binding ACTB.","text":"Secreted bacterial ENO1 from Mycoplasma bovis binds host beta-actin (ACTB) to activate host glycolysis (Warburg effect) and ROS-mediated inflammatory signaling.","pmid":"40867552","year":"2025","url":"https://pubmed.ncbi.nlm.nih.gov/40867552/","same":false}],"literature":[]}},{"gene":"PCLAF","verdict":"insufficient","why":"Evidence links PCLAF to DREAM complex-driven cell cycle/plasticity in lung cells, not mRNA splicing/hnRNP processing in endothelium.","other":{"gene_function":[{"title":"PCLAF-DREAM drives alveolar cell plasticity for lung regeneration.","text":"PCLAF, via the DREAM complex, drives alveolar progenitor cell plasticity, promoting AT1 cell regeneration from AT2 cells and preventing lung fibrosis.","pmid":"39448571","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/39448571/","same":false},{"title":"Variant 2 of KIAA0101, antagonizing its oncogenic variant 1, might be a potential therapeutic strategy in hepatocellular carcinoma.","text":"The alternative splice variant KIAA0101 tv2 antagonizes oncogenic tv1, inhibiting HCC cell proliferation, migration, invasion, and tumorigenesis while promoting apoptosis and p53 activity.","pmid":"28410205","year":"2017","url":"https://pubmed.ncbi.nlm.nih.gov/28410205/","same":false},{"title":"Kiaa0101 serves as a prognostic marker and promotes invasion by regulating p38/snail1 pathway in glioma.","text":"Kiaa0101 promotes glioma cell migration and invasion by activating p38MAPK signaling to upregulate snail1, and its expression correlates with worse patient survival.","pmid":"33708887","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/33708887/","same":false}],"literature":[]}},{"gene":"KRT19","verdict":"insufficient","why":"No evidence links KRT19 to hnRNP-driven splicing, proliferation regulation via splicing, or glycolytic metabolism support.","other":{"gene_function":[{"title":"Prognostic significance of KRT19 in Lung Squamous Cancer.","text":"KRT19 mRNA and protein are overexpressed in ,"year":"","url":"","same":false}],"other":{"gene_function":[{"title":"RPL34-AS1-induced RPL34 inhibits cervical cancer cell tumorigenesis via the MDM2-P53 pathway.","text":"RPL34, induced by antisense lncRNA RPL34-AS1, acts as a tumor suppressor inhibiting cervical cancer cell proliferation, migration and invasion via the MDM2-P53 pathway.","pmid":"33675124","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/33675124/","same":false},{"title":"Dystroglycan and mitochondrial ribosomal protein L34 regulate differentiation in the Drosophila eye.","text":"Mitochondrial ribosomal protein L34 (mRpL34) interacts genetically with Dystroglycan to regulate photoreceptor neuronal differentiation and elongation in the Drosophila eye.","pmid":"20463973","year":"2010","url":"https://pubmed.ncbi.nlm.nih.gov/20463973/","same":false}],"literature":[]}},{"gene":"RPLP2","verdict":"supported","why":"RPLP2 encodes a core 60S ribosomal subunit protein, directly implicating it in ribosome structure and translation machinery.","cell_type":"evidence from other cell types","supporting":[{"title":"Screening of potential diagnostic markers and therapeutic targets against colorectal cancer","text":"RPLP2 encodes a component of the 60S ribosomal subunit, indicating direct role in ribosome structure.","pmid":"26185457","year":"2015","url":"https://pubmed.ncbi.nlm.nih.gov/26185457/","same":false},{"title":"Quantitative analysis of the human ovarian carcinoma mitochondrial phosphoproteome","text":"RPLP2 linked to translation initiation and 60S ribosomal subunit joining pathways.","pmid":"31442208","year":"2019","url":"https://pubmed.ncbi.nlm.nih.gov/31442208/","same":false}],"other":{"gene_function":[{"title":"A Comparative Analysis of Erythropoietin and Carbamoylated Erythropoietin Proteome Profiles.","text":"RPLP2 (Rplp2) protein expression is regulated by EPO/CEPO treatment in neuronal PC-12 cells, implicated in pathways related to synaptic plasticity and translation.","pmid":"33921564","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/33921564/","same":false}],"literature":[]}},{"gene":"RPL38","verdict":"mixed","why":"RPL38/eL38 is a 60S ribosomal protein incorporated into translating ribosomes, but knockdown studies show it is dispensable for bulk translation.","cell_type":"evidence from other cell types","supporting":[{"title":"Knockdown of the Ribosomal Protein eL38 in HEK293 Cells Changes the Translational Efficiency of Specific Genes","text":"eL38 knockdown does not prevent ribosome assembly or general translation, but selectively alters translation of specific gene sets in HEK293 cells.","pmid":"33926116","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/33926116/","same":false}],"other":{"gene_function":[{"title":"HOXA9 promotes proliferation, metastasis and prevents apoptosis in hepatocellular carcinoma.","text":"RPL38 controls expression of HOXA9, which promotes proliferation, metastasis and suppresses apoptosis in hepatocellular carcinoma.","pmid":"39292289","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/39292289/","same":false},{"title":"Epitope mapping of metuximab on CD147 using phage display and molecular docking.","text":"This paper is about epitope mapping of the metuximab antibody on CD147 and does not study RPL38 gene function; the 'L38' reference is an unrelated CD147 residue position, not the RPL38 ribosomal protein.","pmid":"23861727","year":"2013","url":"https://pubmed.ncbi.nlm.nih.gov/23861727/","same":false}],"literature":[]}}],"others":[{"gene":"RPS27","verdict":"insufficient","why":"Evidence covers RPS27's antiviral NF-\u03baB role in shrimp, not its ribosomal protein function in translation.","other":{"gene_function":[{"title":"Kinetochore-bound Mps1 regulates kinetochore-microtubule attachments via Ndc80 phosphorylation.","text":"This paper concerns the mitotic checkpoint kinase Mps1 (TTK), not the ribosomal protein RPS27 (also historically abbreviated MPS-1); it shows Mps1 phosphorylates Ndc80 to weaken kinetochore-microtubule attachments during error correction.","pmid":"34647959","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/34647959/","same":false},{"title":"RPS27, a sORF-Encoded Polypeptide, Functions Antivirally by Activating the NF-\u03baB Pathway and Interacting With Viral Envelope Proteins in Shrimp.","text":"RPS27 (MjRPS27) is a ribosomal protein with an antiviral, non-ribosomal moonlighting function that activates NF-kB signaling and inhibits WSSV replication by interacting with viral envelope proteins.","pmid":"31921103","year":"2019","url":"https://pubmed.ncbi.nlm.nih.gov/31921103/","same":false},{"title":"Mps1 phosphorylation sites regulate the function of centrin 2 in centriole assembly.","text":"This paper is about the centrosomal kinase Mps1 (TTK), not RPS27 ribosomal protein; it shows Mps1 phosphorylates Centrin 2 to drive centriole assembly/overproduction.","pmid":"20980622","year":"2010","url":"https://pubmed.ncbi.nlm.nih.gov/20980622/","same":false}],"literature":[]}},{"gene":"RPL37A","verdict":"insufficient","why":"Evidence only shows RPL37A as a hub gene in OA and a stable reference gene, not functional ribosome biogenesis data.","other":{"gene_function":[{"title":"Sex Differences in Osteoarthritis Pathogenesis: A Comprehensive Study Based on Bioinformatics.","text":"RPL37A is identified as a hub gene downregulated in synovial fluid of female osteoarthritis patients compared to healthy controls, suggesting sex-specific involvement in OA pathogenesis.","pmid":"32255771","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/32255771/","same":false},{"title":"Selection of reliable reference genes during THP-1 monocyte differentiation into macrophages.","text":"RPL37A mRNA expression remains highly stable during THP-1 monocyte-to-macrophage differentiation, making it a reliable reference gene for RT-qPCR normalization.","pmid":"21122122","year":"2010","url":"https://pubmed.ncbi.nlm.nih.gov/21122122/","same":false},{"title":"Expression of long non-coding RNAs in complete transection spinal cord injury: a transcriptomic analysis.","text":"A pseudogene-derived lncRNA, Rpl37a-ps1, is downregulated in rat spinal cord after complete transection spinal cord injury.","pmid":"31997824","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/31997824/","same":false}],"literature":[]}},{"gene":"RPS28","verdict":"insufficient","why":"Papers only examine yeast Rps28-Edc3 interaction in mRNA decay, not its ribosomal translation function in endothelial cells.","other":{"gene_function":[{"title":"Structural definition and substrate specificity of the S28 protease family: the crystal structure of human prolylcarboxypeptidase.","text":"This paper describes the crystal structure of PRCP, an unrelated S28 family serine protease, and does not concern the ribosomal protein RPS28 gene.","pmid":"20540760","year":"2010","url":"https://pubmed.ncbi.nlm.nih.gov/20540760/","same":false},{"title":"25(OH) vitamin D serum values and rheumatoid arthritis disease activity (DA S28 ESR).","text":"This clinical study examines correlation between serum vitamin D levels and the DAS28 disease activity score in rheumatoid arthritis patients, unrelated to the RPS28 gene.","pmid":"25202442","year":"2014","url":"https://pubmed.ncbi.nlm.nih.gov/25202442/","same":false},{"title":"Identification of the Rps28 binding motif from yeast Edc3 involved in the autoregulatory feedback loop controlling RPS28B mRNA decay.","text":"Yeast Rps28 ribosomal protein binds directly to Edc3 via a specific motif, and this interaction is required for autoregulatory decay of RPS28B mRNA but not for Edc3's general decapping function.","pmid":"23956223","year":"2013","url":"https://pubmed.ncbi.nlm.nih.gov/23956223/","same":false}],"literature":[]}},{"gene":"RPS21","verdict":"insufficient","why":"RPS21 is a known ribosomal protein, but provided evidence only addresses osteosarcoma invasion/MAPK, not translation function.","other":{"gene_function":[{"title":"Down-Regulation of Ribosomal Protein RPS21 Inhibits Invasive Behavior of Osteosarcoma Cells Through the Inactivation of MAPK Pathway.","text":"Knockdown of RPS21 suppresses osteosarcoma cell proliferation, colony formation, migration, and invasion via inactivation of the MAPK (MEK/ERK) signaling pathway.","pmid":"32612383","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/32612383/","same":false},{"title":"Biochemical and computational study of an alginate lyase produced by Pseudomonas aeruginosa strain S21.","text":"This paper characterizes a bacterial alginate lyase enzyme from Pseudomonas aeruginosa strain S21, unrelated to the human RPS21 ribosomal protein gene.","pmid":"32489560","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/32489560/","same":false}],"literature":[]}},{"gene":"RPL39","verdict":"insufficient","why":"Papers show RPL39 in cancer signaling/oncogenesis but provide no direct evidence of its role in translation or ribosome biogenesis.","other":{"gene_function":[{"title":"Role of RPL39 in Metaplastic Breast Cancer.","text":"RPL39 and its A14V mutation promote metaplastic breast cancer growth, migration, and chemoresistance via iNOS/nitric oxide signaling.","pmid":"28040796","year":"2016","url":"https://pubmed.ncbi.nlm.nih.gov/28040796/","same":false},{"title":"Deducing putative ancestral forms of GNRA/receptor interactions from the ribosome.","text":"The L39 RNA loop forms a universally conserved long-range GNRA-like interaction with H89 near the ribosomal peptidyl transferase center, important for large subunit rRNA folding/assembly.","pmid":"30418638","year":"2019","url":"https://pubmed.ncbi.nlm.nih.gov/30418638/","same":false},{"title":"Identification and validation of a 17-gene signature to improve the survival prediction of gliomas.","text":"RPL39 knockdown inhibits glioma cell proliferation and migration and reduces M2 macrophage polarization/infiltration, while overexpression has the opposite effect.","pmid":"36248799","year":"2022","url":"https://pubmed.ncbi.nlm.nih.gov/36248799/","same":false}],"literature":[]}},{"gene":"RPL6","verdict":"insufficient","why":"Evidence only shows RPL6's oncogenic role in cancer cell proliferation, not its translation/ribosome biogenesis function.","other":{"gene_function":[{"title":"RPL6: A Key Molecule Regulating Zinc- and Magnesium-Bound Metalloproteins of Parkinson's Disease.","text":"RPL6 is downregulated in PBMCs of Parkinson's disease patients and acts as a network hub gene linking metalloprotein clusters regulated by serum zinc and magnesium.","pmid":"33790735","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/33790735/","same":false},{"title":"NOP2/Sun RNA methyltransferase 2 promotes tumor progression via its interacting partner RPL6 in gallbladder carcinoma.","text":"RPL6 physically interacts with the RNA methyltransferase NSUN2 and its knockdown reduces NSUN2 protein translation while increasing NSUN2 transcript levels, affecting gallbladder cancer progression.","pmid":"31487418","year":"2019","url":"https://pubmed.ncbi.nlm.nih.gov/31487418/","same":false},{"title":"Downregulation of RPL6 by siRNA inhibits proliferation and cell cycle progression of human gastric cancer cell lines.","text":"Knockdown of RPL6 by siRNA inhibits gastric cancer cell proliferation, colony formation, and tumorigenesis in vivo by suppressing G1 to S phase cell cycle transition via downregulation of cyclin E.","pmid":"22043320","year":"2011","url":"https://pubmed.ncbi.nlm.nih.gov/22043320/","same":false}],"literature":[]}},{"gene":"ATP5ME","verdict":"contradicted","why":"ATP5ME functions in mitochondrial ATP synthase assembly/OXPHOS, not cytoplasmic translation or ribosome biogenesis.","other":{"gene_function":[{"title":"The role of ATP synthase subunit e (ATP5I) in mediating the metabolic and antiproliferative effects of metformin in cancer cells.","text":"ATP5I is a direct biguanide-binding target that maintains F1F0-ATP synthase dimer stability, and its loss recapitulates metformin's metabolic and antiproliferative effects while conferring resistance to biguanides.","pmid":"42138716","year":"2026","url":"https://pubmed.ncbi.nlm.nih.gov/42138716/","same":false},{"title":"Biallelic Loss-Of-Function Variant in ATP5ME Is Associated With Severe and Early Onset Oxidative Phosphorylation Deficiency.","text":"Loss-of-function variants or knockout of ATP5ME cause severe oxidative phosphorylation deficiency with impaired mitochondrial respiration, reduced ATP, and developmental defects, rescuable by human ATP5ME mRNA.","pmid":"42403019","year":"2026","url":"https://pubmed.ncbi.nlm.nih.gov/42403019/","same":false},{"title":"RNA-binding protein RALY reprogrammes mitochondrial metabolism via mediating miRNA processing in colorectal cancer.","text":"ATP5I is one of several mitochondrial/ETC genes whose expression is downregulated by RALY-induced miRNAs (miR-483, miR-676, miR-877), contributing to metabolic reprogramming in colorectal cancer.","pmid":"33219048","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/33219048/","same":false}],"literature":[]}},{"gene":"RPL41","verdict":"insufficient","why":"RPL41 is a known ribosomal protein but the evidence only shows an expression change in T cells without functional confirmation.","other":{"gene_function":[{"title":"Comparative genomic analysis of Myroides odoratimimus isolates.","text":"This paper is about comparative genomics of Myroides odoratimimus bacterial strains and uses 'L41' only as a strain name, not referring to the RPL41 gene.","pmid":"29797432","year":"2018","url":"https://pubmed.ncbi.nlm.nih.gov/29797432/","same":false},{"title":"Comprehensive analysis of DNA methylation and gene expression in orally tolerized T cells.","text":"RPL41 mRNA is strongly up-regulated in orally tolerized (anergic) T cells compared to normal T cells.","pmid":"32097442","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/32097442/","same":false},{"title":"Recent Positive Selection in Genes of the Mammalian Epidermal Differentiatio e-Dependent Cleavage of DDX21 Suppresses Host Innate Immunity","text":"DDX21 binds rRNAs/snoRNAs in HeLa cells, promoting rRNA transcription, processing, and modification; nucleolar localization required for pre-rRNA processing.","pmid":"34125604","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/34125604/","same":false}],"other":{"gene_function":[{"title":"DDX21, a Host Restriction Factor of FMDV IRES-Dependent Translation and Replication.","text":"DDX21 acts as a host restriction factor that inhibits FMDV IRES-dependent translation and replication, and is degraded by viral proteases to subvert this defense.","pmid":"34578346","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/34578346/","same":false},{"title":"Phase separation of DDX21 promotes colorectal cancer metastasis via MCM5-dependent EMT pathway.","text":"DDX21 undergoes liquid-liquid phase separation that drives transcriptional activation of MCM5 to promote EMT and colorectal cancer metastasis.","pmid":"37029300","year":"2023","url":"https://pubmed.ncbi.nlm.nih.gov/37029300/","same":false}],"literature":[]}},{"gene":"NIFK","verdict":"supported","why":"NIFK's RRM directly mediates pre-rRNA processing (ITS1/ITS2 cleavage) required for 28S/5.8S rRNA maturation and ribosome biogenesis.","cell_type":"evidence from other cell types","supporting":[{"title":"The RNA recognition motif of NIFK is required for rRNA maturation during cell cycle progression","text":"NIFK's RRM binds ITS2 and is required for ITS1 processing, 28S/5.8S rRNA maturation, and ribosome biogenesis.","pmid":"25826659","year":"2015","url":"https://pubmed.ncbi.nlm.nih.gov/25826659/","same":false},{"title":"The nucleolar protein NIFK promotes cancer progression via CK1\u03b1/\u03b2-catenin in metastasis and Ki-67-dependent cell proliferation","text":"Focuses on Wnt/CK1\u03b1/\u03b2-catenin signaling and proliferation; does not address rRNA processing.","pmid":"26984280","year":"2016","url":"https://pubmed.ncbi.nlm.nih.gov/26984280/","same":false}],"other":{"gene_function":[{"title":"Structural analysis reveals the flexible C-terminus of Nop15 undergoes rearrangement to recognize a pre-ribosomal RNA folding intermediate.","text":"Structural and biophysical analysis of the yeast NIFK ortholog Nop15 reveals that its flexible C-terminal region masks and then rearranges to expose the RRM RNA-binding surface, enabling specific recognition of a pre-ribosomal RNA (ITS2) stem-loop folding intermediate.","pmid":"27789691","year":"2017","url":"https://pubmed.ncbi.nlm.nih.gov/27789691/","same":false}],"literature":[]}},{"gene":"ESF1","verdict":"supported","why":"ESF1 directly participates in pre-rRNA processing and pre-40S ribosomal subunit assembly, core nucleolar ribosome biogenesis functions.","cell_type":"evidence from other cell types","supporting":[{"title":"Human RPF1 and ESF1 in Pre-rRNA Processing and the Assembly of Pre-Ribosomal Particles: A Functional Study","text":"ESF1 knockdown reduces 40S subunit peak and alters pre-rRNA processing ratios, showing role in ribosome assembly. ESF1 knockdown inhibits A0 site cleavage of pre-rRNA, causing 30S precursor accumulation. ESF1 associates with pre-40S particles and SSU processome, interacting with 18S rRNA 5' domain.","pmid":"38391939","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/38391939/","same":false},{"title":"ESF1 and MIPEP proteins promote estrogen receptor-positive breast cancer proliferation and are associated with patient prognosis","text":"ESF1 is a conserved nuclear protein involved in rRNA biosynthesis and ribosome formation.","pmid":"39004717","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/39004717/","same":false}],"other":{"gene_function":[{"title":"UTP14A, DKC1, DDX10, PinX1, and ESF1 Modulate Cardiac Angiogenesis Leading to Obesity-Induced Cardiac Injury.","text":"ESF1 was identified as a hub gene in a PPI network of DEGs associated with obesity-induced reduction in cardiac microvessel density and endothelial proliferation.","pmid":"35734237","year":"2022","url":"https://pubmed.ncbi.nlm.nih.gov/35734237/","same":false}],"literature":[]}},{"gene":"NOP16","verdict":"mixed","why":"NOP16 (HSPC111) localizes to nucleolus and associates with an RNA-dependent ribosomal assembly complex, but its precise function remains undefined.","cell_type":"evidence from other cell types","supporting":[{"title":"The estrogen and c-Myc target gene HSPC111 is over-expressed in breast cancer and associated with poor patient outcome","text":"HSPC111/NOP16 is nucleolar and part of an RNA-dependent complex linked to ribosomal assembly, but function unclear.","pmid":"18373870","year":"2008","url":"https://pubmed.ncbi.nlm.nih.gov/18373870/","same":false}],"other":{"gene_function":[{"title":"Cancer-derived exosomal HSPC111 promotes colorectal cancer liver metastasis by reprogramming lipid metabolism in cancer-associated fibroblasts.","text":"Cancer-derived exosomal HSPC111 (NOP16) reprograms lipid metabolism in cancer-associated fibroblasts by phosphorylating ACLY, promoting pre-metastatic niche formation and colorectal cancer liver metastasis.","pmid":"35027547","year":"2022","url":"https://pubmed.ncbi.nlm.nih.gov/35027547/","same":false},{"title":"Significant association of YAP1 and HSPC111 proteins with poor prognosis in Chinese gastric cancer patients.","text":"HSPC111 (NOP16) expression is elevated in gastric cancer and correlates with YAP1 expression and poor prognosis.","pmid":"29113304","year":"2017","url":"https://pubmed.ncbi.nlm.nih.gov/29113304/","same":false}],"literature":[]}}],"others":[{"gene":"AMD1","verdict":"insufficient","why":"All evidence links AMD1 to polyamine biosynthesis, mTORC1 regulation, and HCC stemness, not ribosome biogenesis or rRNA processing.","other":{"gene_function":[{"title":"AMD1 upregulates hepatocellular carcinoma cells stemness by FTO mediated mRNA demethylation.","text":"AMD1 promotes hepatocellular carcinoma cell stemness, proliferation and metastasis by increasing spermidine-mediated IQGAP1-FTO interaction, which stabilizes FTO and enhances FTO-mediated m6A demethylation of pluripotency factor mRNAs (SOX2, KLF4, NANOG).","pmid":"33783988","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/33783988/","same":false},{"title":"mTORC1-dependent AMD1 regulation sustains polyamine metabolism in prostate cancer.","text":"AMD1 protein stability and activity are regulated downstream of mTORC1 signaling, and AMD1-driven polyamine (dcSAM) synthesis is required for prostate cancer cell proliferation and tumor growth.","pmid":"28658205","year":"2017","url":"https://pubmed.ncbi.nlm.nih.gov/28658205/","same":false},{"title":"The AKT2/SIRT5/TFEB pathway as a potential therapeutic target in non-neovascular AMD.","text":"This paper studies the AKT2/SIRT5/TFEB signaling pathway in retinal pigment epithelium in age-related macular degeneration (AMD, the eye disease); it does not investigate the AMD1 gene (S-adenosylmethionine decarboxylase) at all.","pmid":"39034314","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/39034314/","same":false}],"literature":[]}},{"gene":"CD3EAP","verdict":"insufficient","why":"No evidence was provided for CD3EAP; cannot confirm role in nucleolar ribosome biogenesis or rRNA processing.","other":{"gene_function":[{"title":"Ase1 domains dynamically slow anaphase spindle elongation and recruit Bim1 to the midzone.","text":"This paper studies budding yeast Ase1 (a PRC1-family microtubule crosslinker), not human CD3EAP/POLR1G; it shows Ase1 domains control anaphase spindle elongation rate and recruit Bim1 to the midzone.","pmid":"32997572","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/32997572/","same":false},{"title":"MAP65/Ase1 promote microtubule flexibility.","text":"This paper shows that MAP65/Ase1 family microtubule crosslinkers (including yeast Ase1) decrease microtubule rigidity and promote bundle flexibility in vitro; it does not study CD3EAP/POLR1G.","pmid":"23615441","year":"2013","url":"https://pubmed.ncbi.nlm.nih.gov/23615441/","same":false},{"title":"CLASP promotes microtubule bundling in metaphase spindle independently of Ase1/PRC1 in fission yeast.","text":"This paper examines fission yeast Ase1 and CLASP (Peg1) in spindle microtubule bundling during mitosis, unrelated to human CD3EAP/POLR1G function in RNA Pol I transcription.","pmid":"31615768","year":"2019","url":"https://pubmed.ncbi.nlm.nih.gov/31615768/","same":false}],"literature":[]}},{"gene":"MAT2A","verdict":"insufficient","why":"Evidence covers MAT2A's role in methionine/SAM metabolism, splicing, and HMGCS1 regulation, not ribosome biogenesis or rRNA processing.","other":{"gene_function":[{"title":"Activation of MAT2A-RIP1 signaling axis reprograms monocytes in gastric cancer.","text":"MAT2A drives methionine metabolism-dependent epigenetic reprogramming of tumor-associated macrophages, upregulating RIP1 via H3K4me3 to promote a pro-tumor, anti-inflammatory macrophage phenotype.","pmid":"33593829","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/33593829/","same":false},{"title":"SAM homeostasis is regulated by CFIm-mediated splicing of MAT2A.","text":"MAT2A pre-mRNA splicing and SAM homeostasis are regulated by CFIm25-mediated splicing of its detained intron, coupling SAM sensing to MAT2A expression.","pmid":"33949310","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/33949310/","same":false},{"title":"A biomimetic senotherapy replenishing MAT2A promotes wound regeneration in preclinical models.","text":"Loss of MAT2A in pericytes induces cellular senescence via impaired OTUB1-HMGCS1-mediated coenzyme Q synthesis and mitochondrial dysfunction, driving persistent inflammatory macrophage infiltration and impaired wound regeneration.","pmid":"41298385","year":"2025","url":"https://pubmed.ncbi.nlm.nih.gov/41298385/","same":false}],"literature":[]}},{"gene":"CEBPZ","verdict":"insufficient","why":"No evidence provided for CEBPZ in any system relevant to nucleolar ribosome biogenesis or rRNA processing.","other":{"gene_function":[{"title":"Overexpression of the CBF2 transcriptional activator in Arabidopsis delays leaf senescence and extends plant longevity.","text":"This paper studies the plant transcription factor CBF2 (C-repeat/DRE binding factor 2), an unrelated plant gene sharing only an acronym with human CEBPZ, showing it delays leaf senescence and extends plant longevity when overexpressed.","pmid":"19854800","year":"2010","url":"https://pubmed.ncbi.nlm.nih.gov/19854800/","same":false},{"title":"Neurovascular Unit Dysfunction and Neurodegenerative Disorders.","text":"This review discusses cerebral blood flow (abbreviated CBF, unrelated to the CEBPZ/CBF2 transcription factor) and blood-brain barrier dysfunction in neurodegenerative disease, and does not address the CEBPZ gene.","pmid":"32410936","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/32410936/","same":false},{"title":"Physiological and Molecular Mechanism Involved in Cold Stress Tolerance in Plants.","text":"This review covers the plant ICE-CBF-COR cold-signaling pathway involving CBF/DREB transcription factors, which are plant genes unrelated to human CEBPZ despite the shared 'CBF' abbreviation.","pmid":"32353940","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/32353940/","same":false}],"literature":[]}},{"gene":"SNHG15","verdict":"insufficient","why":"All evidence concerns SNHG15 in cancer ceRNA/signaling pathways, none linking it to ribosome biogenesis or rRNA processing.","other":{"gene_function":[{"title":"Long non-coding RNA SNHG15 in various cancers: a meta and bioinformatic analysis.","text":"SNHG15 overexpression correlates with worse overall survival, disease-free survival, and advanced TNM stage/lymph node metastasis across multiple cancer types.","pmid":"33243205","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/33243205/","same":false},{"title":"SNHG15-mediated feedback loop interplays with HNRNPA1/SLC7A11/GPX4 pathway to promote gastric cancer progression.","text":"SNHG15 is required for gastric cancer cell growth, migration, and invasion, and inhibits ferroptosis by stabilizing SLC7A11 via HNRNPA1, forming a feedback loop with E2F1/MYC.","pmid":"38720175","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/38720175/","same":false},{"title":"LncRNA SNHG15 modulates gastric cancer tumorigenesis by impairing miR-506-5p expression.","text":"Silencing SNHG15 suppresses proliferation, migration, and invasion and promotes apoptosis in gastric cancer cells, an effect mediated through sponging miR-506-5p.","pmid":"33899079","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/33899079/","same":false}],"literature":[]}},{"gene":"SRSF7","verdict":"insufficient","why":"Papers show SRSF7 regulates its own splicing and nuclear body assembly, not rRNA processing or ribosome biogenesis.","other":{"gene_function":[{"title":"SRSF7 knockdown promotes apoptosis of colon and lung cancer cells.","text":"SRSF7 knockdown inhibits proliferation and promotes apoptosis in colon and lung cancer cells by regulating alternative splicing of the apoptosis regulator Fas.","pmid":"29556298","year":"2018","url":"https://pubmed.ncbi.nlm.nih.gov/29556298/","same":false},{"title":"SRSF7 promotes pulmonary fibrosis through regulating PKM alternative splicing in lung fibroblasts.","text":"SRSF7 is upregulated in IPF and promotes pulmonary fibrosis by regulating alternative splicing of PKM, causing metabolic dysregulation and fibroblast activation; fibroblast-specific Srsf7 knockout confers resistance to bleomycin-induced fibrosis.","pmid":"40654335","year":"2025","url":"https://pubmed.ncbi.nlm.nih.gov/40654335/","same":false},{"title":"SRSF7 maintains its homeostasis through the expression of Split-ORFs and nuclear body assembly.","text":"SRSF7 autoregulates its own protein homeostasis via a negative feedback loop involving poison exon inclusion, nonsense-mediated decay, translation of Split-ORFs, and nuclear body assembly that sequesters its own transcripts.","pmid":"32123389","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/32123389/","same":false}],"literature":[]}},{"gene":"GNL3","verdict":"insufficient","why":"Retrieved GNL3 papers focus on DNA repair/SUMOylation, not ribosome biogenesis or rRNA processing.","other":{"gene_function":[{"title":"Common variants in the GNL3 contribute to the increasing risk of knee osteoarthritis in Han Chinese population.","text":"Common GNL3 variants (rs11177) are associated with increased susceptibility to knee osteoarthritis in a Han Chinese population.","pmid":"29942097","year":"2018","url":"https://pubmed.ncbi.nlm.nih.gov/29942097/","same":false},{"title":"Common variants in GNL3 gene contributed the susceptibility of hand osteoarthritis in Han Chinese population.","text":"GNL3 SNP rs11177 is associated with susceptibility to hand osteoarthritis and correlates with disease severity (K-L grade, pain score) in a Han Chinese population.","pmid":"36167888","year":"2022","url":"https://pubmed.ncbi.nlm.nih.gov/36167888/","same":false},{"title":"GNL3 SUMOylation is essential for DNA double-strand break repair by homologous recombination.","text":"GNL3 is SUMOylated at K196 in response to DNA damage and this SUMOylation is required for DNA end resection, RAD51/RPA loading, homologous recombination repair, and cell viability after genotoxic stress.","pmid":"41279596","year":"2025","url":"https://pubmed.ncbi.nlm.nih.gov/41279596/","same":false}],"literature":[]}},{"gene":"SNHG4","verdict":"insufficient","why":"Evidence covers SNHG4 in cancer/pain contexts via ceRNA/miRNA sponging, none showing nucleolar rRNA processing or ribosome biogenesis.","other":{"gene_function":[{"title":"lncRNA SNHG4 modulates colorectal cancer cell cycle and cell proliferation through regulating miR-590-3p/CDK1 axis.","text":"SNHG4 acts as a ceRNA sponging miR-590-3p to upregulate CDK1, promoting colorectal cancer cell cycle progression and proliferation.","pmid":"33744866","year":"2021","url":"https://pubmed.ncbi.nlm.nih. s associated with cellular proliferation in SAG resistant clinical isolates of Leishmania donovani.","text":"Overexpression of 60S ribosomal protein L23a in drug-sensitive Leishmania donovani reduces sensitivity to SAG and other anti-leishmanial drugs and increases parasite proliferation.","pmid":"24340105","year":"2013","url":"https://pubmed.ncbi.nlm.nih.gov/24340105/","same":false}],"literature":[]}},{"gene":"RPS26","verdict":"supported","why":"RPS26 is a core 40S ribosomal protein essential for ribosome assembly and translation, matching the ribosomal protein synthesis component of the annotation.","cell_type":"evidence from other cell types","supporting":[{"title":"A RanGTP-independent mechanism allows ribosomal protein nuclear import for ribosome assembly","text":"eS26/RPS26 required for cytoplasmic processing of pre-rRNA and incorporation into assembling pre-ribosome.","pmid":"25144938","year":"2014","url":"https://pubmed.ncbi.nlm.nih.gov/25144938/","same":false},{"title":"Ribosomal Protein Rps26 Influences 80S Ribosome Assembly in Saccharomyces cerevisiae","text":"Rps26 (including human ortholog expressed in yeast) needed for proper 40S and 80S ribosome assembly, essential for viability.","pmid":"27303706","year":"2016","url":"https://pubmed.ncbi.nlm.nih.gov/27303706/","same":false}],"other":{"gene_function":[{"title":"Loss of oocyte Rps26 in mice arrests oocyte growth and causes premature ovarian failure.","text":"Oocyte-specific loss of Rps26 arrests oocyte growth at the NSN-to-SN chromatin transition, reduces transcription and histone/DNA methylation, lowers GDF9/BMP15/CX37 levels, disrupts PI3K/AKT/FOXO3a signaling, and causes premature ovarian failure.","pmid":"30451825","year":"2018","url":"https://pubmed.ncbi.nlm.nih.gov/30451825/","same":false}],"literature":[]}},{"gene":"MT-ND5","verdict":"mixed","why":"MT-ND5 is a complex I subunit whose translation/protein levels affect mitochondrial respiration, supporting mitochondrial but not ribosomal translation.","cell_type":"evidence from other cell types","supporting":[{"title":"N1-methylation of adenosine (m1A) in ND5 mRNA leads to complex I dysfunction in Alzheimer\u2019s disease","text":"m1A methylation impairs mitoribosomal translation of ND5 mRNA, reducing ND5 protein and complex I activity.","pmid":"","year":"","url":"","same":false},{"title":"Mitochondrial mutations alter endurance exercise response and determinants in mice","text":"Mitochondrial gene mutations (ND6, CO1) alter complex activity and exercise capacity, unrelated to MT-ND5 directly.","pmid":"35482926","year":"2022","url":"https://pubmed.ncbi.nlm.nih.gov/35482926/","same":false}],"other":{"gene_function":[{"title":"N1-methylation of adenosine (m1A) in ND5 mRNA leads to complex I dysfunction in Alzheimer's disease.","text":"m1A methylation of ND5 mRNA by TRMT10C represses ND5 translation and leads to complex I dysfunction in an Alzheimer's disease cell model and patient brain tissue.","pmid":"38287100","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/38287100/","same":false},{"title":"Relationship between oxidative stress and lifespan in Daphnia pulex.","text":"Naturally occurring ND5 sequence variants in short-lived Daphnia clones correlate with reduced complex I enzymatic activity, increased oxidative protein damage, and altered ROS scavenger expression.","pmid":"35149730","year":"2022","url":"https://pubmed.ncbi.nlm.nih.gov/35149730/","same":false}],"literature":[]}},{"gene":"RPS6","verdict":"mixed","why":"RPS6 is a core ribosomal protein shown to mediate local mRNA translation, supporting ribosomal synthesis but not mitochondrial translation.","cell_type":"evidence from other cell types","supporting":[{"title":"Vesicular Rps6 Released by Astrocytes in an Experimental Model of AD Regulates Local Translation and Enhances Synaptic Integrity in Neurones","text":"Rps6 packaged in astrocyte vesicles drives local mRNA translation in neurons, supporting a direct role in protein synthesis.","pmid":"41416952","year":"2025","url":"https://pubmed.ncbi.nlm.nih.gov/41416952/","same":false},{"title":"Iterative, multimodal, and scalable single-cell profiling for discovery and characterization of signaling regulators","text":"pRPS6 used as readout of mTOR-driven translational control but no direct ribosomal/mitochondrial translation mechanism shown.","pmid":"40909507","year":"2025","url":"https://pubmed.ncbi.nlm.nih.gov/40909507/","same":false}],"other":{"gene_function":[{"title":"Structures of Saccharolobus solfataricus initiation complexes with leaderless mRNAs highlight archaeal features and eukaryotic proximity.","text":"Cryo-EM structural analysis identifies an additional domain of eS6 (RPS6 ortholog) within the archaeal small ribosomal subunit involved in translation initiation.","pmid":"39753558","year":"2025","url":"https://pubmed.ncbi.nlm.nih.gov/39753558/","same":false}],"literature":[]}}],"others":[{"gene":"RPS8","verdict":"insufficient","why":"Evidence only shows RPS8 as a glioma prognostic biomarker, not its role in ribosome/mitochondrial translation biology.","other":{"gene_function":[{"title":"Distinct sex-specific DNA methylation differences in Alzheimer's disease.","text":"A CpG mapped to RPS8 showed sex-specific (female) DNA methylation differences associated with Alzheimer's disease in blood.","pmid":"36109771","year":"2022","url":"https://pubmed.ncbi.nlm.nih.gov/36109771/","same":false},{"title":"Integrated Bioinformatics Analysis of Differentially Expressed RNA-Binding Proteins in Human Gliomas.","text":"RPS8 expression was found to strongly correlate with overall survival in glioma patients as part of a bioinformatics RNA-binding protein analysis.","pmid":"41361662","year":"2025","url":"https://pubmed.ncbi.nlm.nih.gov/41361662/","same":false},{"title":"Wheat genotypes differing in aluminum tolerance differ in their growth response to CO2 enrichment in acid soils.","text":"This paper studies wheat aluminum-sensitive genotype ES8, unrelated to human RPS8 gene function.","pmid":"23789057","year":"2013","url":"https://pubmed.ncbi.nlm.nih.gov/23789057/","same":false}],"literature":[]}},{"gene":"RPS10","verdict":"insufficient","why":"Evidence only shows RPS10 undergoes ubiquitylation in ribosome quality control, not its role in synthesis or mitochondrial translation.","other":{"gene_function":[{"title":"Mechanism of Oleogel-S10: A triterpene preparation for the treatment of epidermolysis bullosa.","text":"This review discusses Oleogel-S10 (a birch bark triterpene wound-healing agent) and is unrelated to RPS10 the ribosomal protein gene.","pmid":"31168940","year":"2019","url":"https://pubmed.ncbi.nlm.nih.gov/31168940/","same":false},{"title":"Distinct regulatory ribosomal ubiquitylation events are reversible and hierarchically organized.","text":"RPS10 (eS10), a 40S ribosomal protein, is site-specifically ubiquitylated by ZNF598 as a critical initiating signal for ribosome-associated quality control upon ribosome stalling, and this ubiquitylation is reversible via deubiquitylating enzymes such as USP21 and OTUD3, with eS10 ubiquitylation being required prior to uS10 ubiquitylation in a hierarchical ubiquitin code.","pmid":"32011234","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/32011234/","same":false},{"title":"Key Metabolites and Mechanistic Changes for Salt Tolerance in an Experimentally Evolved Sulfate-Reducing Bacterium, Desulfovibrio vulgaris.","text":"This paper discusses a bacterial clone named 'ES10-5' in the context of salt tolerance evolution in Desulfovibrio vulgaris and is unrelated to the human RPS10 gene.","pmid":"29138306","year":"2017","url":"https://pubmed.ncbi.nlm.nih.gov/29138306/","same":false}],"literature":[]}},{"gene":"RPS18","verdict":"insufficient","why":"No evidence provided addresses RPS18's role in ribosome biogenesis or mitochondrial translation in any system.","other":{"gene_function":[{"title":"Single-cell sequencing combined with spatial transcriptomics reveals that the IRF7 25","url":"https://pubmed.ncbi.nlm.nih.gov/39807629/","same":false},{"title":"Genome-wide CRISPR activation screen identifies JADE3 as an antiviral activator of NF-kB-dependent IFITM3 expression.","text":"IFITM3 expression is induced downstream of the NF-kB-activating antiviral gene JADE3, contributing to restriction of influenza A virus infection.","pmid":"38462163","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/38462163/","same":false},{"title":"Listeria exploits IFITM3 to suppress antibacterial activity in phagocytes.","text":"IFITM3 is required for type I interferon-mediated suppression of phagosomal proteolysis, which is exploited by Listeria monocytogenes to escape phagosomes and spread; Ifitm3-/- mice are resistant to systemic Listeria infection.","pmid":"34404769","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/34404769/","same":false}],"literature":[]}},{"gene":"RPL26","verdict":"insufficient","why":"Evidence only shows RPL26 is UFMylated at the ER translocon, not its role in ribosome biogenesis or mitochondrial translation.","other":{"gene_function":[{"title":"Pseudorabies Virus UL24 Abrogates Tumor Necrosis Factor Alpha-Induced NF-\u03baB Activation by Degrading P65.","text":"This paper actually characterizes the pseudorabies virus (PRV) UL24 protein (a viral immune evasion factor), not the human ribosomal protein RPL26/uL24; the gene name overlap with 'uL24' alias is coincidental and does not represent RPL26 function.","pmid":"31906441","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/31906441/","same":false},{"title":"Mechanism of herpesvirus UL24 protein regulating viral immune escape and virulence.","text":"This review summarizes how herpesvirus UL24 tegument proteins (distinct viral genes, not RPL26) mediate immune escape, pathogenicity, and cell cycle effects during infection.","pmid":"37808279","year":"2023","url":"https://pubmed.ncbi.nlm.nih.gov/37808279/","same":false},{"title":"The UFM1 E3 ligase recognizes and releases 60S ribosomes from ER translocons.","text":"RPL26 (uL24), a 60S ribosomal subunit protein, is the principal substrate of the UFM1 E3 ligase complex (UREL: UFL1-UFBP1-CDK5RAP3), which UFMylates RPL26 at Lys134 to enable release of stalled 60S ribosomes from the SEC61 translocon at the ER membrane.","pmid":"38383789","year":"2024","url":"https://pubmed.ncbi.nlm.nih.gov/38383789/","same":false}],"literature":[]}},{"gene":"RPS24","verdict":"insufficient","why":"RPS24 is a core ribosomal protein required for ribosome biogenesis, but zebrafish studies show no direct evidence of translation or mitochondrial translation effects.","other":{"gene_function":[{"title":"Systematic transcriptome analysis of the zebrafish model of diamond-blackfan anemia induced by RPS24 deficiency.","text":"RPS24 knockdown in zebrafish causes ribosomopathy-like Diamond-Blackfan anemia phenotypes with defective primitive and definitive hematopoiesis, vascular development gene dysregulation, and apoptosis, partially mediated by p53.","pmid":"25189322","year":"2014","url":"https://pubmed.ncbi.nlm.nih.gov/25189322/","same":false},{"title":"Vagus nerve stimulation alleviates S. aureus-induced mastitis by regulating gut microbiota S24-7-PPAR\u03b3 and NF-\u039aB/NLRP3 signaling in mice.","text":"This paper studies the gut bacterial taxon S24-7 (Muribaculaceae), not the RPS24 ribosomal protein gene, and shows it mediates anti-inflammatory effects via PPARgamma/NF-kB/NLRP3 signaling in a mastitis model.","pmid":"41430282","year":"2025","url":"https://pubmed.ncbi.nlm.nih.gov/41430282/","same":false},{"title":"Effects of S24-7 on the weight of progeny rats after exposure to ceftriaxone sodium during pregnancy.","text":"This paper examines the gut bacterial taxon S24-7 as part of the microbiome and its correlation with offspring body weight after antibiotic exposure, not the RPS24 ribosomal protein gene.","pmid":"34082715","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/34082715/","same":false}],"literature":[]}},{"gene":"RPL32","verdict":"insufficient","why":"RPL32 is a ribosomal protein implicated in ribosome biogenesis stress sensing in lung cancer, but no direct evidence of translation synthesis or mitochondrial function shown.","other":{"gene_function":[{"title":"RPL32 Promotes Lung Cancer Progression by Facilitating p53 Degradation.","text":"RPL32 is overexpressed in lung cancer and promotes tumor cell proliferation by facilitating MDM2-mediated degradation of p53.","pmid":"32516735","year":"2020","url":"https://pubmed.ncbi.nlm.nih.gov/32516735/","same":false},{"title":"Transcriptional downregulation of rice rpL32 gene under abiotic stress is associated with removal of transcription factors within the promoter region.","text":"Rice rpL32 genes, especially rpL32_8.1, are transcriptionally downregulated under abiotic stress via removal of transcription factors from promoter cis-elements.","pmid":"22132208","year":"2011","url":"https://pubmed.ncbi.nlm.nih.gov/22132208/","same":false},{"title":"Pseudogene RPL32P3 regulates the blood-tumor barrier permeability via the YBX2/HNF4G axis.","text":"The RPL32 pseudogene RPL32P3 (not RPL32 itself, which was unchanged) is upregulated in glioma-exposed endothelial cells and promotes blood-tumor barrier integrity by recruiting KMT2A to activate YBX2 transcription, which stabilizes HNF4G mRNA to upregulate tight junction proteins.","pmid":"34819492","year":"2021","url":"https://pubmed.ncbi.nlm.nih.gov/34819492/","same":false}],"literature":[]}},{"gene":"RPL23","verdict":"insufficient","why":"The only evidence found does not mention RPL23 at all, focusing instead on RPL17 in Diamond-Blackfan anemia cells.","other":{"gene_function":[{"title":"An atypical form of 60S ribosomal subunit in Diamond-Blackfan anemia linked to RPL17 variants.","text":"RPL17 (RPL23/uL14 paralog naming aside, this is RPL17/uL22) variants cause ribosomal RNA maturation defects and haploinsufficiency leading to Diamond-Blackfan anemia with altered 60S ribosomal
