// ---- data ---------------------------------------------------------------------------------
const DAYS = META.conditions;
const IDS = Object.keys(PROGRAMS).map(Number).sort((a,b)=>a-b);
let currentId = null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("brand").innerHTML = `${esc(META.title)}${META.subtitle ? `<small>${esc(META.subtitle)}</small>` : ""}`;
// adj p like Python's "{:.2g}": two significant digits, exponent form below 1e-4
function fmtP(q) {
  if (q == null) return "";
  q = Number(q);
  if (q === 0 || Math.abs(q) >= 1e-4) return String(Number(q.toPrecision(2)));
  const [m, e] = q.toExponential(1).split("e");
  return m.replace(/\.0$/, "") + "e" + e[0] + e.slice(1).padStart(2, "0");
}
const signed = (v, d=2) => v == null ? "" : (v > 0 ? "+" : "") + Number(v).toFixed(d);

const SEARCH_INDEX = {};
for (const id of IDS) {
  const p = PROGRAMS[id], d = p.drivers || {driving: [], others: []};
  SEARCH_INDEX[id] = [p.label, p.sentence, p.group, p.top_genes.join(" "), p.distinctive.join(" "),
    p.regulators.map(r => r.gene).join(" "), p.grid.map(g => g.gene).join(" "), p.go.join(" "),
    d.driving.map(g => g.gene).join(" "), d.others.map(g => g.gene).join(" "),
    "P"+id, "program "+id].join(" ").toLowerCase();
}

// ---- rail ---------------------------------------------------------------------------------
function buildRail() {
  let out = "";
  for (const g of META.groups) {
    const ids = IDS.filter(id => PROGRAMS[id].group === g);
    if (!ids.length) continue;
    out += `<h4>${esc(g)} (${ids.length})</h4>`;
    out += ids.map(id => { const p = PROGRAMS[id];
      return `<a data-id="${id}" href="#program-${id}" onclick="render(${id});return false;">` +
             `<span class="num">P${id}</span><span>${esc(p.label)}</span>${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ""}</a>`; }).join("");
  }
  document.getElementById("rail").innerHTML = out;
  filterRail();
}
function filterRail() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  let shown = 0;
  document.querySelectorAll(".rail a").forEach(a => {
    const ok = !q || SEARCH_INDEX[a.dataset.id].includes(q); a.style.display = ok ? "" : "none"; if (ok) shown++; });
  document.querySelectorAll(".rail h4").forEach(h => {
    let el = h.nextElementSibling, any = false;
    while (el && el.tagName === "A") { if (el.style.display !== "none") any = true; el = el.nextElementSibling; }
    h.style.display = any ? "" : "none"; });
  document.getElementById("meta").textContent = q ? `${shown} of ${IDS.length} programs` : `${IDS.length} programs · ${META.built}`;
}

// ---- genes --------------------------------------------------------------------------------
// gene chip linked to NCBI Gene: the gene's page when its Entrez id is known, else a symbol search
function geneHref(p, g) {
  const c = p.genes[g] || {};
  return c.entrez ? `https://www.ncbi.nlm.nih.gov/gene/${c.entrez}`
    : `https://www.ncbi.nlm.nih.gov/gene/?term=${encodeURIComponent(g)}%5Bsym%5D+AND+${encodeURIComponent(META.organism)}%5Borgn%5D`;
}
function chip(p, g, hit) {
  const name = (p.genes[g] || {}).name;
  return `<a class="chip${hit ? " hit" : ""}" href="${esc(geneHref(p, g))}" target="_blank" rel="noopener"${name ? ` data-tip="${esc(g + ": " + name)}"` : ""}>${esc(g)}</a>`;
}
const chips = (p, arr, hits) => (arr || []).length ? arr.map(g => chip(p, g, hits && hits.has(g))).join("") : `<span class="muted small">None.</span>`;

// ---- activity -----------------------------------------------------------------------------
function activityCard(p) {
  const conds = Object.keys(p.activity || {});
  if (!conds.length) return "";
  if (conds.length === 1) {
    const a = p.activity[conds[0]];
    return `<p class="sub">${esc(conds[0])}: expressed in ${a.pct_cells_expressed}% of cells · mean usage ${a.mean_usage}</p>`;
  }
  const max = Math.max(...conds.map(c => p.activity[c].mean_usage)) || 1;
  const peak = conds.reduce((a, c) => p.activity[c].mean_usage > p.activity[a].mean_usage ? c : a, conds[0]);
  const cols = conds.map(c => { const a = p.activity[c], h = Math.max(1, Math.round(100 * a.mean_usage / max));
    return `<div class="col" data-tip="${esc(`${c}: mean usage ${a.mean_usage}, expressed in ${a.pct_cells_expressed}% of cells`)}"><div class="v">${a.pct_cells_expressed}%</div><div class="b" style="height:${h}%"></div></div>`; }).join("");
  const axis = conds.map(c => `<div class="${c === peak ? "pk" : ""}">${esc(c)}</div>`).join("");
  return `<div class="card"><h3>Program activity by condition</h3><div class="act">${cols}</div><div class="axis">${axis}</div>
    <p class="small muted" style="margin:8px 0 0">Mean program usage per condition (% of cells expressing the program above each bar). Peak: <b>${esc(peak)}</b>.</p></div>`;
}

// ---- colours ------------------------------------------------------------------------------
function mix(a, b, t) {
  const pa = a.match(/\w\w/g).map(h=>parseInt(h,16)), pb = b.match(/\w\w/g).map(h=>parseInt(h,16));
  return "rgb(" + pa.map((x,i)=>Math.round(x+(pb[i]-x)*t)).join(",") + ")";
}
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function divColor(v, scale) {
  const t = Math.min(1, Math.abs(v) / scale);
  return mix(cssVar("--div-mid"), cssVar(v < 0 ? "--div-neg" : "--div-pos"), 0.15 + 0.85 * t);
}
function inkFor(v, scale) { return Math.abs(v) / scale > 0.55 ? "#ffffff" : "var(--text)"; }

// ---- regulators ---------------------------------------------------------------------------
let gridShowAll = false;
function regulatorGrid(p) {
  if (!p.grid.length) return `<p class="muted">No knockdown reached adj p &lt; ${META.p_value}.</p>`;
  const rows = gridShowAll ? p.grid : p.grid.slice(0, 30);
  const scale = Math.max(1, ...p.grid.flatMap(g => g.cells.filter(c=>c).map(c => Math.abs(c[0]))));
  const capped = Math.min(scale, 3);
  const head = `<tr><th></th>${DAYS.map((d,i)=>`<th>${DAYS.length > 1 ? esc(d) : "log2FC"}<br><span class="muted">${p.grid.filter(g => g.cells[i] && g.cells[i][1]).length} sig</span></th>`).join("")}</tr>`;
  const body = rows.map(g => `<tr><td class="g">${esc(g.gene)}</td>` + g.cells.map((c, i) => {
      if (!c) return `<td class="c na">n/a</td>`;
      const [v, sig, q] = c;
      const role = v < 0 ? "activator (knockdown lowers program)" : "repressor (knockdown raises program)";
      const tip = `${g.gene} · ${DAYS[i]}: log2FC ${signed(v)}, adj p ${fmtP(q)}${sig ? " — significant, " + role : " — not significant"}`;
      return `<td class="c${sig?" sig":""}" style="background:${divColor(v, capped)};color:${inkFor(v, capped)}" data-tip="${esc(tip)}">${signed(v)}${sig?"*":""}</td>`;
    }).join("") + `</tr>`).join("");
  const more = p.grid.length > 30
    ? `<p class="small"><button class="link" onclick="gridShowAll=!gridShowAll;render(currentId,true)">${gridShowAll ? "Show top 30" : `Show all ${p.grid.length} regulators`}</button></p>` : "";
  return `<div class="legend"><span><span class="sw" style="background:var(--div-neg)"></span>negative log2FC = knockdown lowers program (activator)</span>
      <span><span class="sw" style="background:var(--div-pos)"></span>positive = knockdown raises program (repressor)</span>
      <span><b>bold, outlined, *</b> = significant (adj p &lt; ${META.p_value})</span></div>
    <div style="overflow-x:auto"><table class="heat">${head}${body}</table></div>${more}
    <p class="small muted">${DAYS.length > 1 ? "log2FC of regulators significant (adj p &lt; " + META.p_value + ") in any condition, ordered by number of significant conditions then best adjusted p." : "Every significant regulator, ordered by adjusted p."} Colour saturates at |log2FC| = ${capped.toFixed(1)}.</p>`;
}

const MAX_LABELS_PER_PANEL = 8;
function volcanoes(p) {
  if (!p.volcano.length || !p.volcano.some(v => v.x.length)) return `<p class="muted">No regulator results.</p>`;
  const names = META.regulator_names, keys = new Set(p.regulators.map(r => r.gene));
  const multi = p.volcano.length > 1;
  const W = multi ? 250 : 560, H = multi ? 250 : 320, m = {l: 40, r: 10, t: 34, b: 30};
  // Robust x range: a handful of extreme non-significant knockdowns would otherwise squash the
  // plot. Significant points always fit; anything beyond the range is clamped to the edge.
  const absx = p.volcano.flatMap(v => v.x.map(a => Math.abs(a) / 100)).sort((a, b) => a - b);
  const q995 = absx[Math.floor(0.995 * (absx.length - 1))] || 1;
  const sigmax = Math.max(0, ...p.volcano.flatMap(v => v.x.filter((_, j) => v.s[j]).map(a => Math.abs(a) / 100)));
  const xmax = Math.min(8, Math.max(1, q995, 1.1 * sigmax));
  const ymax = Math.max(1.5, ...p.volcano.flatMap(v => v.y.map(a => a / 100)));
  const sx = x => m.l + (Math.max(-xmax, Math.min(xmax, x)) + xmax) / (2 * xmax) * (W - m.l - m.r);
  const sy = y => H - m.b - y / ymax * (H - m.t - m.b);
  const thr = -Math.log10(META.p_value);
  const panels = p.volcano.map((v, i) => {
    let dots = "", labels = [];
    const order = v.x.map((_, j) => j).sort((a, b) => v.s[a] - v.s[b]);  // significant drawn last, on top
    for (const j of order) {
      const x = v.x[j] / 100, y = v.y[j] / 100, gene = names[v.g[j]], sig = v.s[j];
      const fill = sig ? (x < 0 ? "var(--div-neg)" : "var(--div-pos)") : "var(--muted)";
      const r = sig ? 3.2 : 1.8, op = sig ? 0.95 : 0.35;
      const tip = `${gene} · ${v.condition}: log2FC ${signed(x)}, adj p ${Math.pow(10, -y).toExponential(1)}${sig ? (x < 0 ? " — activator" : " — repressor") : " — n.s."}`;
      dots += `<circle cx="${sx(x).toFixed(1)}" cy="${sy(y).toFixed(1)}" r="${r}" fill="${fill}" fill-opacity="${op}" stroke="var(--surface)" stroke-width="${sig ? 1 : 0}" data-tip="${esc(tip)}"/>`;
      if (sig) labels.push({gene, x, y, key: keys.has(gene)});
    }
    // Label the top regulators given to the annotator first, then the most significant others.
    labels.sort((a, b) => (b.key - a.key) || (b.y - a.y));
    const placed = [];
    let text = "";
    for (const l of labels.slice(0, MAX_LABELS_PER_PANEL)) {
      let lx = sx(l.x) + (l.x < 0 ? -5 : 5), ly = sy(l.y) - 4;
      while (placed.some(q => Math.abs(q.y - ly) < 11 && Math.abs(q.x - lx) < 48)) ly += 11;
      placed.push({x: lx, y: ly});
      text += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="10.5" text-anchor="${l.x < 0 ? "end" : "start"}" fill="var(--text)" font-weight="${l.key ? 700 : 400}" font-family="var(--mono)">${esc(l.gene)}</text>`;
    }
    const ticks = [-Math.floor(xmax), 0, Math.floor(xmax)].filter((t, k, a) => a.indexOf(t) === k);
    const yticks = [0, Math.round(ymax / 2), Math.floor(ymax)].filter((t, k, a) => a.indexOf(t) === k);
    const axis = `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--border)"/>
      <line x1="${sx(0)}" x2="${sx(0)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--border)"/>
      <line x1="${m.l}" x2="${W - m.r}" y1="${sy(thr)}" y2="${sy(thr)}" stroke="var(--muted)" stroke-dasharray="3,3"/>
      <text x="${W - m.r}" y="${sy(thr) - 3}" font-size="9.5" text-anchor="end" fill="var(--muted)">adj p = ${META.p_value}</text>
      ${ticks.map(t => `<text x="${sx(t)}" y="${H - m.b + 12}" font-size="10" text-anchor="middle" fill="var(--text-soft)">${t}</text>`).join("")}
      ${yticks.map(t => `<text x="${m.l - 4}" y="${sy(t) + 3}" font-size="10" text-anchor="end" fill="var(--text-soft)">${t}</text>`).join("")}
      <text x="${(m.l + W - m.r) / 2}" y="${H - 4}" font-size="10" text-anchor="middle" fill="var(--text-soft)">log2FC (knockdown effect)</text>
      <text x="12" y="${(m.t + H - m.b) / 2}" font-size="10" text-anchor="middle" fill="var(--text-soft)" transform="rotate(-90 10 ${(m.t + H - m.b) / 2})">−log10 adj p</text>
      <text x="${m.l}" y="13" font-size="11.5" font-weight="700" fill="var(--text)">${esc(v.condition)}</text>
      <text x="${W - m.r}" y="13" font-size="10.5" text-anchor="end" fill="var(--text-soft)">${p.n_sig_by_condition[i]} of ${v.x.length} significant</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Volcano plot ${esc(v.condition)}" style="max-width:100%">${axis}${dots}${text}</svg>`;
  }).join("");
  return `<div class="legend"><span><span class="sw" style="background:var(--div-neg)"></span>activator — knockdown lowers the program</span>
      <span><span class="sw" style="background:var(--div-pos)"></span>repressor — knockdown raises it</span>
      <span><span class="sw" style="background:var(--muted);opacity:.5"></span>not significant</span>
      <span><b>bold label</b> = top regulator given to the annotator</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:10px">${panels}</div>
    <p class="small muted">Program log2FC on knockdown per perturbed gene${multi ? ", one panel per condition, same axes" : ""}; coloured = adj p ≤ ${META.p_value} and log2FC ≥ ${META.up} or ≤ ${META.down}. Up to ${MAX_LABELS_PER_PANEL} significant regulators labelled per panel. Hover a point for its values.</p>`;
}

function regulatorTable(p) {
  if (!p.regulators.length) return `<p class="muted small">No significant regulator.</p>`;
  const rows = p.regulators.map(r => { const c = p.genes[r.gene] || {};
    const alt = c.symbol && c.symbol !== r.gene ? ` <span class="muted">(${esc(c.symbol)})</span>` : "";
    const role = r.log2fc == null ? "" : r.log2fc < 0 ? "activator ↓" : "repressor ↑";
    return `<tr><td style="font-family:var(--mono)"${c.name ? ` data-tip="${esc(c.name)}"` : ""}><b>${esc(r.gene)}</b>${alt}</td>
      <td>${signed(r.log2fc)}</td><td><span class="status"><span class="dot" style="background:${r.log2fc < 0 ? "var(--div-neg)" : "var(--div-pos)"}"></span>${role}</span></td>
      <td>${esc(r.adj_p)}</td><td>${esc(r.condition)}</td></tr>`; }).join("");
  return `<table><tr><th>Regulator</th><th>log2FC</th><th>Sign</th><th>adj p</th><th>Condition</th></tr>${rows}</table>`;
}

// ---- driving genes ------------------------------------------------------------------------
const VERDICT = {supported: "var(--good)", mixed: "var(--warning)", contradicted: "var(--critical)"};
function verdictCell(v) { return `<span class="status"><span class="dot" style="background:${VERDICT[v] || "var(--muted)"}"></span>${esc(v)}</span>`; }
const pmidLink = id => `<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(id)}/" target="_blank" rel="noopener">PMID ${esc(id)}</a>`;
function paperItem(x) {
  const title = x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title);
  const info = [x.year ? esc(x.year) : "", x.pmid ? pmidLink(x.pmid) : "",
                x.same ? `<span class="flag" style="color:var(--good)">same cell type</span>` : ""].filter(Boolean).join(" · ");
  return `<li><div>${title}</div>${x.text ? `<div class="small">${esc(x.text)}</div>` : ""}${info ? `<div class="small muted">${info}</div>` : ""}</li>`;
}
const paperList = arr => `<ul class="papers">${arr.map(paperItem).join("")}</ul>`;
function otherPapers(o, wrap) {
  const n = o.gene_function.length + o.literature.length;
  if (!n) return wrap ? "" : `<span class="muted small">No paper retrieved.</span>`;
  const body = (o.gene_function.length ? `<div class="psub">Gene function search</div>${paperList(o.gene_function)}` : "") +
               (o.literature.length ? `<div class="psub">Program literature search</div>${paperList(o.literature)}` : "");
  return wrap ? `<details class="more"><summary>Other literature searched (${n})</summary>${body}</details>` : body;
}
function driversCard(p) {
  const d = p.drivers;
  if (!d) return "";
  const hits = new Set(d.driving.map(g => g.gene));
  const rows = d.driving.map(g => `<tr><td>${chip(p, g.gene, true)}</td><td>${verdictCell(g.verdict)}</td>
      <td>${esc(g.why)}${g.cell_type ? `<div class="small muted" style="margin-top:4px">${esc(g.cell_type)}</div>` : ""}</td>
      <td style="min-width:320px">${g.supporting.length ? paperList(g.supporting) : `<span class="muted small">No supporting paper listed.</span>`}${otherPapers(g.other, true)}</td></tr>`).join("");
  const others = d.others.map(g => `<tr><td>${chip(p, g.gene)}</td><td>${verdictCell(g.verdict)}</td><td>${esc(g.why)}</td>
      <td style="min-width:320px">${otherPapers(g.other, false)}</td></tr>`).join("");
  return `<details class="card" open><summary>Driving genes (${d.driving.length}) — with support</summary>
    ${rows ? `<table><tr><th>Gene</th><th>Verdict</th><th>Why</th><th>Supporting papers</th></tr>${rows}</table>` : `<p class="muted">No gene's literature explains this label.</p>`}
    ${others ? `<details class="sub-details"><summary>Other genes searched (${d.others.length})</summary><table><tr><th>Gene</th><th>Verdict</th><th>Why</th><th>Papers searched</th></tr>${others}</table></details>` : ""}
    <p class="small muted">Genes whose own papers explain the label (paper-qa evidence${d.judge_model ? ", verdicts by " + esc(d.judge_model) : ""}), supported before mixed.</p></details>`;
}

// ---- pre-annotation screen ----------------------------------------------------------------
function screenCard(p) {
  const s = p.screen;
  if (!s) return "";
  const dot = (t, c) => `<span class="status"><span class="dot" style="background:${c}"></span>${t}</span>`;
  const fam = s.families.map(f => `<tr><td>Family: <b>${esc(f.name)}</b></td><td>${f.primary ? dot("Primary", "var(--warning)") : dot("Called", "var(--serious)")}</td>
      <td>${f.n_overlap} of ${s.n_top} top genes (expected ${f.expected}), p = ${esc(f.p_value)}<div style="margin-top:4px">${chips(p, f.genes)}</div></td></tr>`).join("")
    || `<tr><td>Family label</td><td>${dot("None", "var(--good)")}</td><td>No family or marker set has ≥ ${s.min_genes} of the top ${s.n_top} genes at p ≤ ${s.max_p}.</td></tr>`;
  const c = s.chrom;
  let chrom;
  if (c && c.p < 0.05) chrom = `<tr><td>Chromosome: <b>${esc(c.top_chromosome)}</b></td><td>${c.flag ? dot("Flagged", "var(--critical)") : dot("Enriched", "var(--warning)")}</td>
      <td>${c.genes_on_top_chromosome} of ${c.n_genes_located} located top genes (expected ${c.expected_on_top_chromosome}, fold ${c.fold_enrichment}), binomial p = ${esc(c.binomial_p)}<div style="margin-top:4px">${chips(p, c.top_chromosome_genes)}</div></td></tr>`;
  else chrom = `<tr><td>Chromosome enrichment</td><td>${dot(c ? "None" : "Cannot assess", c ? "var(--good)" : "var(--muted)")}</td>
      <td>No chromosome enriched at p &lt; 0.05${c ? ` (most genes on ${esc(c.top_chromosome)}: ${c.genes_on_top_chromosome} vs ${c.expected_on_top_chromosome} expected, p = ${esc(c.binomial_p)})` : ""}.</td></tr>`;
  return `<div class="card"><h3>Pre-annotation screen</h3><table><tr><th>Screen</th><th>Status</th><th>Evidence</th></tr>${fam}${chrom}</table>
    ${s.all_genes.length ? `<details class="more"><summary>All ${s.all_genes.length} screened genes</summary><div>${chips(p, s.all_genes)}</div></details>` : ""}
    <p class="small muted">Gene families and marker sets enriched among the top ${s.n_top} genes, against this run's gene universe; chromosome holding more top genes than expected (binomial test).</p></div>`;
}

// ---- page ---------------------------------------------------------------------------------
function render(id, keepScroll) {
  const p = PROGRAMS[id]; if (!p) return;
  if (id !== currentId) gridShowAll = false;
  currentId = id;
  document.querySelectorAll(".rail a").forEach(a => a.classList.toggle("active", +a.dataset.id === id));
  const active = document.querySelector(".rail a.active"); if (active) active.scrollIntoView({block: "nearest"});
  history.replaceState(null, "", "#program-" + id);
  if (!keepScroll) window.scrollTo(0, 0);
  const d = p.drivers, hits = new Set(d ? d.driving.map(g => g.gene) : []);
  const supported = d ? d.driving.length : 0, searched = d ? d.driving.length + d.others.length : 0;
  const topN = META.membership_top ? `top ${META.membership_top} ` : "";
  const soft = `style="background:var(--surface-soft);color:var(--text-soft)"`;
  document.getElementById("main").innerHTML = `
    <span class="pill">Program ${id}</span> ${DAYS.map(c => `<span class="pill" ${soft}>${esc(c)}</span>`).join(" ")}
    ${d ? `<span class="pill" ${soft} title="Driving genes / genes searched">${supported}/${searched} driver genes supported</span>` : ""}
    <h1>${esc(p.label)}</h1>
    <p class="sub">${esc(p.group)}${p.tag ? " · " + esc(p.tag) : ""}</p>
    <p class="lead">${esc(p.sentence)}</p>
    ${activityCard(p)}
    <div class="card"><h3>Genes</h3>
      <p class="small muted" style="margin:0 0 4px">Top ${p.top_genes.length} by program loading${d ? " (outlined = driving gene)" : ""}</p><div>${chips(p, p.top_genes, hits)}</div>
      <p class="small muted" style="margin:10px 0 4px">Top unique genes: high in this program, low in others${META.membership_top ? ` among ${topN}loaded genes` : ""}</p><div>${chips(p, p.distinctive, hits)}</div>
      <p class="small muted" style="margin:6px 0 0">The annotator saw these same genes. Click a gene for its NCBI Gene page.</p></div>
    ${driversCard(p)}
    <div class="card"><h3>${DAYS.length > 1 ? "Regulators by condition" : "Significant regulators"}</h3>
      ${p.volcano.length ? `${volcanoes(p)}
      <details style="margin-top:8px"><summary class="small" style="cursor:pointer">Table view — ${DAYS.length > 1 ? "log2FC of every significant regulator in every condition" : "significant regulators"}</summary>${regulatorGrid(p)}</details>` : ""}
      <h4 style="margin:14px 0 4px">Top regulators given to the annotator</h4>
      <p class="small muted" style="margin:0 0 4px">Program usage log2FC on CRISPRi knockdown; best adj p over conditions</p>${regulatorTable(p)}</div>
    <div class="card"><h3>Top GO terms</h3><p class="small muted" style="margin:0 0 4px">Gene ontology enrichment of ${topN}program genes</p>
      ${p.go.length ? `<ol class="go">${p.go.map(t => `<li>${esc(t)}</li>`).join("")}</ol>` : `<p class="muted">No enriched GO term.</p>`}</div>
    ${screenCard(p)}
    <p class="small muted">Built ${esc(META.built)} · name and summary by ${esc(p.label_model)}${d ? ` · driving genes: paper-qa evidence, verdicts by ${esc(d.judge_model)}` : ""} · source ${esc(p.source)}</p>`;
}

function prev() { const i = IDS.indexOf(currentId); if (i > 0) render(IDS[i-1]); }
function next() { const i = IDS.indexOf(currentId); if (i < IDS.length-1) render(IDS[i+1]); }
document.addEventListener("keydown", e => { if (/input|textarea/i.test(e.target.tagName)) return;
  if (e.key === "ArrowLeft") prev(); if (e.key === "ArrowRight") next(); });

// hover tooltips for chart marks and genes
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => { const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.dataset.tip; tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX + 12, window.innerWidth - 330) + "px"; tip.style.top = (e.clientY + 14) + "px"; });

function applyTheme(t) { document.documentElement.dataset.theme = t; document.getElementById("themeBtn").textContent = t === "dark" ? "Light" : "Dark"; }
function toggleTheme() { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("program-viewer-theme", t); } catch (e) {} applyTheme(t); if (currentId !== null) render(currentId, true); }
let savedTheme = null; try { savedTheme = localStorage.getItem("program-viewer-theme"); } catch (e) {}
applyTheme(savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

buildRail();
function idFromHash() { return parseInt((location.hash.match(/program-(\d+)/) || [])[1]); }
window.addEventListener("hashchange", () => { const id = idFromHash(); if (IDS.includes(id) && id !== currentId) render(id); });
render(IDS.includes(idFromHash()) ? idFromHash() : IDS[0]);
</script>
</body>
</html>
